# CI on Blacksmith runners: Ubuntu x64 (SSE2, plus x86-64-v2/SSE4.1,
# ivybridge/AVX+F16C without FMA, and x86-64-v3/FMA jobs),
# Ubuntu ARM (NEON, plus one armv8.2-a+fp16 job for native half), Windows x64
# (SSE2 via MSVC, plus one /arch:AVX2 job), Windows ARM64 (NEON via MSVC,
# GitHub-hosted), plus FORCE_SCALAR builds on both Linux architectures, and
# one Slang cross-compilation job (pinned Slang release, see docs/slang_compat.md),
# one GLSL cross-check job (glslang -> SPIR-V -> lavapipe, see docs/glsl_interop.md),
# one DXC cross-check job (DXC -> SPIR-V -> lavapipe, see docs/slang_compat.md),
# macOS arm64 (Apple Clang), the README's minimum compiler versions, and one
# Debug ASan/UBSan job, a coverage job, and the SDL_GPU demo rendered headless
# on lavapipe.
# Warnings are errors in this repo's own targets.
# NOTE: the fp16 job compiles FEAT_FP16 instructions unconditionally; the ARM
# runners must support them (check fphp/asimdhp in /proc/cpuinfo) or the
# tests SIGILL.
# Prerequisite: the Blacksmith app must be installed on the GitHub org.
name: ci

# push builds main only; other branches are built by their pull_request run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its in-flight run; main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-gcc
            runner: blacksmith-2vcpu-ubuntu-2404
            cxx: g++
            package: true
            bench: true
          - name: linux-x64-clang
            runner: blacksmith-2vcpu-ubuntu-2404
            cxx: clang++
          - name: linux-arm-gcc
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            cxx: g++
            bench: true
          - name: linux-arm-clang
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            cxx: clang++
          - name: linux-x64-gcc-v3
            runner: blacksmith-2vcpu-ubuntu-2404
            cxx: g++
            bench: true
            cmake_extra: -DCMAKE_CXX_FLAGS=-march=x86-64-v3
          - name: linux-x64-clang-v2
            runner: blacksmith-2vcpu-ubuntu-2404
            cxx: clang++
            cmake_extra: -DCMAKE_CXX_FLAGS=-march=x86-64-v2
          # AVX + F16C without FMA (Sandy/Ivy Bridge class): F16C half
          # conversion on the 128-bit float path, no 2-row 4x4 kernel
          - name: linux-x64-clang-ivybridge
            runner: blacksmith-2vcpu-ubuntu-2404
            cxx: clang++
            cmake_extra: -DCMAKE_CXX_FLAGS=-march=ivybridge
          - name: linux-x64-gcc-scalar
            runner: blacksmith-2vcpu-ubuntu-2404
            cxx: g++
            cmake_extra: -DSHADER_MATH_FORCE_SCALAR=ON
          - name: linux-arm-gcc-fp16
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            cxx: g++
            cmake_extra: -DCMAKE_CXX_FLAGS=-march=armv8.2-a+fp16
          - name: linux-arm-gcc-scalar
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            cxx: g++
            cmake_extra: -DSHADER_MATH_FORCE_SCALAR=ON
          - name: windows-x64-msvc
            runner: blacksmith-2vcpu-windows-2025
            cxx: cl
            package: true
          # MSVC detects FMA / SSE4.1 / AVX from /arch (__AVX2__ / __AVX__),
          # not from the GCC-style macros; _INIT keeps MSVC's default flags.
          - name: windows-x64-msvc-avx2
            runner: blacksmith-2vcpu-windows-2025
            cxx: cl
            cmake_extra: -DCMAKE_CXX_FLAGS_INIT=/arch:AVX2
          # MSVC on AArch64: NEON through MSVC's arm64_neon.h (float32x4_t
          # is the __n128 union there). GitHub-hosted, free for public repos.
          - name: windows-arm64-msvc
            runner: windows-11-arm
            cxx: cl
          # source-based coverage of include/ over the SIMD and scalar test
          # binaries; the report goes to the job summary (nothing is gated)
          - name: linux-x64-clang-coverage
            runner: blacksmith-2vcpu-ubuntu-2404
            cxx: clang++
            build_type: Debug
            coverage: true
            packages: llvm
            cmake_extra: >-
              -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping"
          - name: linux-x64-clang-asan-ubsan
            runner: blacksmith-2vcpu-ubuntu-2404
            cxx: clang++
            build_type: Debug
            cmake_extra: >-
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          - name: linux-x64-gcc10-min
            runner: blacksmith-2vcpu-ubuntu-2204
            cxx: g++-10
            packages: g++-10
          - name: linux-arm-gcc10-min
            runner: blacksmith-2vcpu-ubuntu-2204-arm
            cxx: g++-10
            packages: g++-10
          - name: linux-x64-clang14-min
            runner: blacksmith-2vcpu-ubuntu-2204
            cxx: clang++-14
            packages: clang-14
          - name: macos-arm-appleclang
            runner: macos-15
            cxx: clang++
            package: true
          - name: linux-x64-sdl-demo
            runner: blacksmith-2vcpu-ubuntu-2404
            cxx: g++
            demo: true
            # lavapipe (software Vulkan) for the headless SDL_GPU run
            packages: mesa-vulkan-drivers libvulkan1
            # headless only: SDL without X11 / Wayland
            cmake_extra: -DSHADER_MATH_DEMO_SDLGPU=ON -DSDL_UNIX_CONSOLE_BUILD=ON
          # GLSL cross-check: glslang -> SPIR-V -> lavapipe vs shader-math glsl
          - name: linux-x64-glsl-interop
            runner: blacksmith-2vcpu-ubuntu-2404
            cxx: g++
            packages: glslang-tools libvulkan-dev mesa-vulkan-drivers
            cmake_extra: -DSHADER_MATH_INTEROP_GLSL=ON
          # HLSL against the official compiler: DXC -> SPIR-V -> lavapipe
          - name: linux-x64-dxc-interop
            runner: blacksmith-2vcpu-ubuntu-2404
            cxx: g++
            dxc_version: "1.9.2609"
            dxc_asset: linux_dxc_2026_09_28.x86_x64.tar.gz
            # sha256 of dxc_asset (the release asset digest); update together
            dxc_sha256: 96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1
            packages: libvulkan-dev mesa-vulkan-drivers
            cmake_extra: -DSHADER_MATH_INTEROP_DXC=ON -DSHADER_MATH_DXC_DIR=/tmp/dxc
          - name: linux-x64-slang-interop
            runner: blacksmith-2vcpu-ubuntu-2404
            cxx: g++
            slang_version: "2026.16"
            # lavapipe runs the half cases compiled to SPIR-V
            packages: libvulkan-dev mesa-vulkan-drivers
            # sha256 of slang-<version>-linux-x86_64.tar.gz (matches the
            # release asset digest); update together with slang_version
            slang_sha256: e572e1a293f21971d8a98124c4576848ad4cd6a19b922ce5bad784fee0950648
            cmake_extra: -DSHADER_MATH_INTEROP_SLANG=ON -DSHADER_MATH_SLANG_DIR=/tmp/slang
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ clang libboost-dev ${{ matrix.packages }}

      - name: Install Slang (interop job only)
        if: matrix.slang_version != ''
        run: |
          curl -fsSL -o /tmp/slang.tar.gz \
            https://github.com/shader-slang/slang/releases/download/v${{ matrix.slang_version }}/slang-${{ matrix.slang_version }}-linux-x86_64.tar.gz
          echo "${{ matrix.slang_sha256 }}  /tmp/slang.tar.gz" | sha256sum -c -
          mkdir -p /tmp/slang
          tar -xzf /tmp/slang.tar.gz -C /tmp/slang
          /tmp/slang/bin/slangc -v

      - name: Committed SPIR-V matches shader.slang (interop job only)
        if: matrix.slang_version != ''
        run: |
          bash examples/sdl_gpu_skinning/build_shaders.sh /tmp/slang/bin/slangc
          git diff --exit-code -- examples/sdl_gpu_skinning/

      - name: Install DXC (dxc interop job only)
        if: matrix.dxc_version != ''
        run: |
          curl -fsSL -o /tmp/dxc.tar.gz \
            https://github.com/microsoft/DirectXShaderCompiler/releases/download/v${{ matrix.dxc_version }}/${{ matrix.dxc_asset }}
          echo "${{ matrix.dxc_sha256 }}  /tmp/dxc.tar.gz" | sha256sum -c -
          mkdir -p /tmp/dxc
          tar -xzf /tmp/dxc.tar.gz -C /tmp/dxc
          LD_LIBRARY_PATH=/tmp/dxc/lib /tmp/dxc/bin/dxc --version

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        # macOS: Boost headers are fetched by CMake (FetchContent).
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type || 'Release' }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DSHADER_MATH_WARNINGS_AS_ERRORS=ON \
            ${{ matrix.cmake_extra }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # Boost headers are fetched by CMake (FetchContent) when not installed.
        run: cmake -S . -B build -DSHADER_MATH_WARNINGS_AS_ERRORS=ON ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type || 'Release' }}

      - name: Test
        # read only by -fprofile-instr-generate binaries (the coverage job)
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/prof/%p-%m.profraw
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type || 'Release' }}

      - name: Coverage report (informational)
        if: matrix.coverage
        continue-on-error: true
        run: |
          llvm-profdata merge -sparse build/prof/*.profraw -o build/merged.profdata
          llvm-cov report build/shader_math_tests -object build/shader_math_tests_scalar \
            -instr-profile=build/merged.profdata "$PWD/include" | sed "s|$PWD/||" > coverage.txt
          cat coverage.txt
          {
            echo "### Coverage of include/ (shader_math_tests + scalar twin)"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Informational only: shared runners are noisy, so nothing is gated on
      # the numbers. SIMD and the scalar reference go to the job summary.
      - name: Benchmark (informational)
        if: matrix.bench
        continue-on-error: true
        run: |
          ./build/shader_math_bench
          ./build/shader_math_bench_scalar
          {
            echo "### ${{ matrix.name }}"
            ./build/shader_math_bench --markdown
            echo
            ./build/shader_math_bench_scalar --markdown
          } >> "$GITHUB_STEP_SUMMARY"

      # The clip animates, so identical first / last frames mean the
      # skinned positions never reached the GPU. External assets cover
      # other FBX exporters (downloaded from the pinned ufbx tag).
      - name: SDL_GPU demo (headless, lavapipe)
        if: matrix.demo
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          demo=build/sdl_gpu_skinning
          for backend in scalar simd4; do
            out=/tmp/frames-$backend
            mkdir -p $out
            $demo --headless 3 --backend $backend --out $out
            test -s $out/frame_02.bmp
            if cmp -s $out/frame_00.bmp $out/frame_02.bmp; then
              echo "::error::$backend: frames 0 and 2 are identical"
              exit 1
            fi
          done
          examples/sdl_gpu_skinning/test_external_assets.sh $demo /tmp/ext_assets

      # Downstream use: install + find_package, and add_subdirectory (which
      # must not build shader-math's own tests). Where CMake fetched Boost,
      # the consumer is pointed at those headers explicitly.
      - name: Package consumers
        if: matrix.package
        shell: bash
        run: |
          root="$(cygpath -m "$PWD" 2>/dev/null || pwd)"
          cfg=${{ matrix.build_type || 'Release' }}
          extra=()
          if [ "$RUNNER_OS" != "Windows" ]; then
            extra+=(-DCMAKE_BUILD_TYPE=$cfg -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
          fi
          if [ -d build/_deps/boost_config-src ]; then
            extra+=(-DSHADER_MATH_BOOST_INCLUDE="$root/build/_deps/boost_config-src/include"
                    -DSHADER_MATH_BOOST_PREDEF_INCLUDE="$root/build/_deps/boost_predef-src/include")
          fi
          cmake --install build --prefix "$root/pkg" --config $cfg
          cmake -S tests/package -B build-pkg-find -DSHADER_MATH_CONSUME=find_package \
            -DCMAKE_PREFIX_PATH="$root/pkg" "${extra[@]}"
          cmake --build build-pkg-find --config $cfg
          ctest --test-dir build-pkg-find --output-on-failure -C $cfg
          cmake -S tests/package -B build-pkg-sub -DSHADER_MATH_CONSUME=subdirectory \
            -DSHADER_MATH_SOURCE_DIR="$root" "${extra[@]}"
          cmake --build build-pkg-sub --config $cfg
          ctest --test-dir build-pkg-sub --output-on-failure -C $cfg
          # SHADER_MATH_FORCE_SCALAR reaches consumers through the target
          # (tests/package/main.cpp #errors otherwise), both ways
          for mode in find_package subdirectory; do
            cmake -S tests/package -B build-pkg-scalar-$mode -DSHADER_MATH_CONSUME=$mode \
              -DCMAKE_PREFIX_PATH="$root/pkg" -DSHADER_MATH_SOURCE_DIR="$root" \
              -DSHADER_MATH_FORCE_SCALAR=ON "${extra[@]}"
            cmake --build build-pkg-scalar-$mode --config $cfg
          done
          # pkg-config (not on Windows): compile the consumer with its flags
          if [ "$RUNNER_OS" != "Windows" ] && command -v pkg-config > /dev/null; then
            boost=()
            if [ -d build/_deps/boost_config-src ]; then
              boost=(-I"$root/build/_deps/boost_config-src/include" -I"$root/build/_deps/boost_predef-src/include")
            fi
            flags=$(PKG_CONFIG_PATH="$root/pkg/share/pkgconfig" pkg-config --cflags shader_math)
            echo "pkg-config --cflags shader_math: $flags"
            ${{ matrix.cxx }} -std=c++20 $flags "${boost[@]}" tests/package/main.cpp -o build-pkg-config-consumer
            ./build-pkg-config-consumer
          fi
