# Documentation checks: README.ja.md keeps README.md's structure, and
# relative links resolve (.github/scripts/check_docs.py). ci.yml skips
# Markdown-only changes; this workflow covers them.
name: docs

on:
  push:
    branches: [main]
    paths: ["**.md", "docs/**", ".github/scripts/check_docs.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**.md", "docs/**", ".github/scripts/check_docs.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-docs:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: README.ja.md structure and relative links
        run: python3 .github/scripts/check_docs.py
